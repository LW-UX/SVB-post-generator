name: GitHub Pages deployen

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: Website bauen
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: pnpm einrichten
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Abhängigkeiten installieren
        run: pnpm install --frozen-lockfile

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website bauen
        run: pnpm run build:pages

      - name: Website als Pages-Artefakt hochladen
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages-dist

  deploy:
    name: Website veröffentlichen
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Auf GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
